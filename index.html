<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Psychic-Game</title>

  <!-- Added a link to Bootstrap-->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">

</head>
<body>

  <div class="container py-5 text-center">

    <h1>Psychic-Game</h1>


    <h2>Guess what Letter I'm thinking of!</h2>


    <h2>Press any key in the alphabet to start playing!</h2>

  </div>

  <!-- Here we have div called "score" where our tally of wins, losses, and guesses will go -->
  <h1 class="text-center" id="score"></h1>

  <br><br>

    <div class="container">
        <div class="text-center" id="letterGuess">
            <!-- Here we keep track of what letter was guessed, in a div ID called "letterGuess" -->
        </div>
    </div>

  <script src="assets/javascript/game.js"></script>
</body>
</html>
